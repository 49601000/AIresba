<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="AIレスバ">
  <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon-AIRSB.png">
  <link rel="icon" type="image/png" href="./apple-touch-icon-AIRSB.png">
  <link rel="manifest" href="./manifest.webmanifest">
  <title>AIレスバ演出エンジン v1.3</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="splash-screen" class="splash-overlay">
    <div class="splash-inner">
      <h2 class="splash-title">AIレスバ生成</h2>
      <p class="splash-subtitle">Initializing Debate Engine...</p>
    </div>
  </div>

  <main class="app">
    <header class="app-header">
      <h1 class="app-title">AIレスバ演出エンジン v1.3</h1>
    </header>

    <section class="panel">
      <label for="topicInput" class="label">議題</label>
      <textarea id="topicInput" rows="3" placeholder="例: 回転寿司でまず何を食べるべきか"></textarea>
    </section>

    <section class="panel">
      <label for="styleSelect" class="label">Style</label>
      <select id="styleSelect"></select>
    </section>

    <section class="panel">
      <label for="openingModeSelect" class="label">Opening Mode</label>
      <select id="openingModeSelect"></select>
    </section>

    <section class="panel">
      <label for="lengthPresetSelect" class="label">会話分量</label>
      <select id="lengthPresetSelect"></select>
      <div class="length-custom">
        <label for="lengthMinInput">min</label>
        <input id="lengthMinInput" type="number" min="100" step="50">
        <label for="lengthMaxInput">max</label>
        <input id="lengthMaxInput" type="number" min="100" step="50">
      </div>
    </section>

    <section class="panel controls">
      <button id="rollBtn" type="button">Roll (1d20)</button>
      <button id="generateBtn" type="button">Generate Prompt</button>
      <button id="copyBtn" type="button">Copy</button>
      <button id="geminiOpenBtn" type="button" class="gemini-open-btn" hidden>Geminiで開く</button>
    </section>

    <section class="panel status">
      <p>ダイスロール結果: <strong id="diceResult">未ロール</strong></p>
      <p>適用ルール: <strong id="selectedRule">未選択</strong></p>
      <p>Style: <strong id="selectedStyle">nanj</strong></p>
      <p>Opening: <strong id="selectedOpeningMode">gpt_default</strong></p>
      <p>Length: <strong id="selectedLengthPreset">standard</strong></p>
    </section>

    <section class="panel">
      <h2>Patch Selector</h2>
      <div id="patchContainer" class="patches"></div>
    </section>

    <section class="panel error" id="errorBox" hidden></section>

    <section class="panel">
      <label for="finalPrompt" class="label">Final Prompt</label>
      <textarea id="finalPrompt" rows="22" readonly></textarea>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
